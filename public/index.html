<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colour Canvas</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: #fff;
      color: #000;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
    }

    /* ---- shared input ---- */
    .top {
      position: fixed;
      inset: 0 0 50% 0;
      display: grid;
      place-items: center;
      padding: 0 16px;
      z-index: 2;
      pointer-events: none;
    }
    .field { position: relative; width: min(640px, 100%); pointer-events: auto; }
    input {
      width: 100%;
      border: 0;
      border-bottom: 1.5px solid currentColor;
      padding: 8px 0;
      font: inherit;
      font-size: clamp(18px, 3vw, 28px);
      text-align: center;
      background: transparent;
      color: inherit;
      outline: none;
    }
    .status {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status.on { opacity: 0.5; }

    /* ---- stripes mode (the original replica) ---- */
    .stripes {
      position: fixed;
      inset: 50% 0 0 0;
      display: flex;
      overflow: hidden;
    }
    .stripe {
      flex-basis: 0;
      min-width: 0;
      transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* ---- shader mode ---- */
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
    body.shader canvas { display: block; }
    body.shader .stripes { display: none; }
    body.shader .top { inset: 0 0 auto 0; height: 38%; color: #fff; }
    body.shader .field {
      padding: 10px 28px 14px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
    }
    body.shader input { border-bottom-color: rgba(255, 255, 255, 0.6); }
    body.shader .status { right: 28px; }

    .hud {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 2;
      font-size: 11px;
      line-height: 1.6;
      padding: 8px 12px;
      border-radius: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      white-space: pre;
    }
    body.shader .hud { display: block; }

    .toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 3;
      font: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      color: #000;
      cursor: pointer;
    }
    body.shader .toggle {
      color: #fff;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="top">
    <div class="field">
      <input id="q" value="tomato" autocomplete="off" spellcheck="false" autofocus />
      <div class="status" id="status">thinking…</div>
    </div>
  </div>
  <div class="stripes" id="stripes"></div>
  <div class="hud" id="hud"></div>
  <button class="toggle" id="toggle"></button>

  <script type="module">
    import { PALETTE, ORDER } from "/palette.mjs";
    import { horizonY, lightPosition, lightStrength, compositionVector } from "/scene-uniforms.mjs";

    const input = document.getElementById("q");
    const stripesEl = document.getElementById("stripes");
    const statusEl = document.getElementById("status");
    const hudEl = document.getElementById("hud");
    const toggleEl = document.getElementById("toggle");

    // ------------------------------------------------------------------
    // Stripes (original replica)
    // ------------------------------------------------------------------
    const stripeEls = new Map();

    function renderStripes(colors) {
      const seen = new Set();
      colors.forEach(({ name, hex, weight }, i) => {
        let el = stripeEls.get(name);
        if (!el) {
          el = document.createElement("div");
          el.className = "stripe";
          el.style.flexGrow = "0";
          el.style.backgroundColor = hex;
          stripeEls.set(name, el);
          stripesEl.appendChild(el);
          el.getBoundingClientRect(); // commit the 0 width so it grows in
        }
        el.style.order = String(i);
        el.style.flexGrow = String(weight);
        el.title = `${name} ${(weight * 100).toFixed(0)}%`;
        seen.add(name);
      });
      for (const [name, el] of stripeEls) {
        if (!seen.has(name)) el.style.flexGrow = "0";
      }
    }

    // ------------------------------------------------------------------
    // Shader
    // ------------------------------------------------------------------
    // Every palette colour keeps a fixed slot, ordered around the hue wheel
    // so neighbouring bands blend nicely. Only weights change, which means
    // any palette can morph continuously into any other.
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const N = ORDER.length;
    const FORMS = ["liquid", "organic", "geometric", "glitch"];

    const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 u_res;
uniform float u_time;
uniform vec3 u_colors[${N}];
uniform float u_weights[${N}];
uniform float u_energy;
uniform float u_texture;
uniform vec4 u_form;      // liquid, organic, geometric, glitch
uniform float u_conf;
uniform vec3 u_bg;         // scene background colour (sRGB)
uniform vec3 u_fg;         // scene foreground colour (sRGB)
uniform vec3 u_light;      // glow colour (sRGB)
uniform vec2 u_lightPos;   // glow centre in p-space
uniform float u_glow;      // glow strength 0..1
uniform vec4 u_comp;       // horizon, centre, vertical, field
uniform float u_horizonY;  // horizon line in p-space

const float PI = 3.14159265;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + 17.0; a *= 0.5; }
  return v;
}

// Mirror-fold x into 0..1 so bands never wrap with a seam. Scaling the cosine
// just under 1 rounds off the fold points, which would otherwise be hard creases.
float fold(float x) {
  const float k = 0.985;
  const float lo = 0.05522;   // acos(k) / PI
  return (acos(k * cos(PI * x)) / PI - lo) / (1.0 - 2.0 * lo);
}

// A per-cell random value that glides to its next value instead of snapping.
float glide(vec2 id, float t) {
  float i = floor(t), f = smoothstep(0.0, 1.0, fract(t));
  return mix(hash(id + i * 17.13), hash(id + (i + 1.0) * 17.13), f);
}

// Cell values interpolated with a narrow transition, so cells read as crisp
// tiles but the field stays continuous (no stair-stepping or aliasing).
float tiles(vec2 g, float t, float edge) {
  vec2 i = floor(g), f = fract(g);
  vec2 u = smoothstep(1.0 - edge, 1.0, f);
  return mix(mix(glide(i, t), glide(i + vec2(1, 0), t), u.x),
             mix(glide(i + vec2(0, 1), t), glide(i + vec2(1, 1), t), u.x), u.y);
}

vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }
vec3 toSrgb(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }

// 1 where the scene shows its background, 0 where it shows the foreground.
// Each composition has its own mask; they blend by Jev's probabilities.
float backgroundMask(vec2 p, float t) {
  // Horizon: background above a softly wobbling line.
  float line = u_horizonY + (fbm(vec2(p.x * 1.5, t * 0.2)) - 0.5) * 0.12;
  float mHorizon = smoothstep(line - 0.06, line + 0.06, p.y);

  // Centre: the subject is a wobbly disc; background surrounds it.
  float r = length(p * vec2(0.9, 1.1)) + (fbm(p * 3.0 + t * 0.3) - 0.5) * 0.15;
  float mCentre = smoothstep(0.12, 0.5, r);

  // Vertical: noisy columns rise from the bottom, with open background above.
  float cols = noise(vec2(p.x * 5.0 + (fbm(p * 2.0) - 0.5) * 0.8, 0.5 + t * 0.05));
  float tops = p.y + (noise(vec2(p.x * 9.0, 1.0)) - 0.5) * 0.4;
  float mVertical = max(smoothstep(0.4, 0.6, cols), smoothstep(0.1, 0.5, tops));

  float structured = u_comp.x + u_comp.y + u_comp.z;
  return (u_comp.x * mHorizon + u_comp.y * mCentre + u_comp.z * mVertical) / max(structured, 1e-4);
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;   // aspect-correct, centred
  float t = u_time;
  float amp = mix(0.12, 0.5, u_energy);

  // Liquid: the original stripes, domain-warped into flowing paint.
  vec2 w = vec2(fbm(p * 1.4 + vec2(t, -t * 0.7)), fbm(p * 1.4 + vec2(5.2 - t * 0.8, 1.3 + t)));
  // Under a horizon composition the stripes lie down and stack like sky layers.
  float across = mix(uv.x, 1.0 - uv.y, u_comp.x);
  float fLiquid = across + amp * (w.x - 0.5) * 2.0 + 0.35 * amp * (fbm(p * 2.5 + w * 2.0) - 0.5);

  // Organic: wobbly concentric pools drifting around a moving centre.
  vec2 c = 0.35 * vec2(sin(t * 0.9), cos(t * 0.7));
  float fOrganic = length(p - c) * 1.3 + amp * (fbm(p * 2.0 + t * 0.5) - 0.5) * 1.6;

  // Geometric: slowly rotating bands, offset per tile; offsets glide.
  float ang = t * 0.2;
  vec2 rp = mat2(cos(ang), -sin(ang), sin(ang), cos(ang)) * p;
  float fGeom = rp.x * 0.9 + 0.5 + (tiles(rp * 3.0, t * 0.6, 0.06) - 0.5) * amp * 0.9;

  // Glitch: row tears that fade in and out in bursts rather than re-rolling.
  float burst = smoothstep(0.55, 0.85, noise(vec2(t * 0.9, 3.7)));
  float rows = tiles(vec2(0.5, uv.y * 24.0), t * 1.8, 0.12) - 0.5;
  float fGlitch = uv.x + rows * burst * amp * 1.4;

  float f = fold(dot(u_form, vec4(fLiquid, fOrganic, fGeom, fGlitch)) / max(dot(u_form, vec4(1.0)), 1e-4));

  // Watercolour bleed: fine, slowly evolving noise feathers the band edges.
  // Hard-edged forms (geometric, glitch) get less of it.
  float wet = 1.0 - 0.7 * (u_form.z + u_form.w) / max(dot(u_form, vec4(1.0)), 1e-4);
  f += (fbm(p * 7.0 + vec2(t * 0.15, -t * 0.1)) - 0.5) * 0.05 * wet;

  // Edge width = antialiasing (screen-space) + softness from confidence.
  // Even a confident answer keeps a small soft edge so it never looks jagged.
  float aa = fwidth(f) * 1.5;
  float soft = aa + mix(0.045, 0.01, u_conf) * mix(0.5, 1.0, wet);

  // Palette lookup: each colour owns a band of the field proportional to its
  // weight. Pigment pools darker along each boundary, like watercolour.
  vec3 col = vec3(0.0);
  float rim = 0.0;
  float edge = 0.0;
  for (int i = 0; i < ${N}; i++) {
    float wi = u_weights[i];
    float a = edge;
    edge += wi;
    float b = edge;
    // Empty slots must not paint. A zero-width band at either end of the
    // field would otherwise leave a fringe of the first or last swatch.
    if (wi < 0.0005) continue;
    // Coverage of band i = (past its lower edge) - (past its upper edge).
    // A band that starts at 0 or ends at 1 extends to that end of the field.
    float lo = a < 0.001 ? 1.0 : smoothstep(a - soft, a + soft, f);
    float hi = b > 0.999 ? 0.0 : smoothstep(b - soft, b + soft, f);
    float cover = max(lo - hi, 0.0);
    col += toLinear(u_colors[i]) * cover;
    if (b < 0.998) {
      float d = (f - b) / (soft + aa + 0.004);
      rim = max(rim, exp(-d * d));
    }
  }
  col *= 1.0 - 0.14 * rim * wet;
  // Scene layer: foreground/background regions under the paint. A pure
  // "field" composition keeps the paint layer as it was.
  const float SCENE_MIX = 0.55;
  vec3 sceneCol = mix(toLinear(u_fg), toLinear(u_bg), backgroundMask(p, t));
  col = mix(col, sceneCol, SCENE_MIX * (1.0 - u_comp.w));

  // Light: a tight core plus a wide bloom, added in linear light.
  vec2 dl = p - u_lightPos;
  float r2 = dot(dl, dl);
  col += toLinear(u_light) * u_glow * (exp(-r2 / 0.02) * 0.9 + exp(-r2 / 0.25) * 0.35);

  // Paper: static granulation that doesn't flicker, scaled by texture.
  float paper = fbm(gl_FragCoord.xy * 0.35) - 0.5;
  col *= 1.0 + paper * mix(0.06, 0.28, u_texture);

  col = toSrgb(col);

  // Glitch scanlines (static, so they read as a screen, not flicker).
  col *= 1.0 - u_form.w * 0.1 * step(0.5, fract(gl_FragCoord.y * 0.5));

  // Fine moving grain, kept subtle; the static paper carries most texture.
  col += (hash(gl_FragCoord.xy + fract(t * 7.0) * 91.0) - 0.5) * u_texture * 0.05;

  outColor = vec4(col, 1.0);
}`;

    const VERT = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

    function createShader() {
      const canvas = document.getElementById("gl");
      const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
      if (!gl) return null;

      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a_pos");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const u = (name) => gl.getUniformLocation(prog, name);
      const U = {
        res: u("u_res"), time: u("u_time"), colors: u("u_colors"), weights: u("u_weights"),
        energy: u("u_energy"), texture: u("u_texture"), form: u("u_form"), conf: u("u_conf"),
        bg: u("u_bg"), fg: u("u_fg"), light: u("u_light"), lightPos: u("u_lightPos"),
        glow: u("u_glow"), comp: u("u_comp"), horizonY: u("u_horizonY"),
      };

      gl.uniform3fv(U.colors, new Float32Array(ORDER.flatMap((n) => rgb(PALETTE[n]))));

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 1.5);
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        gl.viewport(0, 0, w, h);
        gl.uniform2f(U.res, w, h);
      }

      return {
        draw(s, time) {
          resize();
          gl.uniform1f(U.time, time);
          gl.uniform1fv(U.weights, s.weights);
          gl.uniform1f(U.energy, s.energy);
          gl.uniform1f(U.texture, s.texture);
          gl.uniform4fv(U.form, s.form);
          gl.uniform1f(U.conf, s.conf);
          gl.uniform3fv(U.bg, s.bg);
          gl.uniform3fv(U.fg, s.fg);
          gl.uniform3fv(U.light, s.light);
          gl.uniform2fv(U.lightPos, s.lightPos);
          gl.uniform1f(U.glow, s.glow);
          gl.uniform4fv(U.comp, s.comp);
          gl.uniform1f(U.horizonY, s.horizonY);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        },
      };
    }

    // Current (eased) and target visual state.
    const initialState = () => ({
      weights: new Float32Array(N).fill(1 / N),
      energy: 0.3, texture: 0.2, form: new Float32Array([1, 0, 0, 0]), conf: 0.5,
      bg: new Float32Array([1, 1, 1]), fg: new Float32Array([0, 0, 0]), light: new Float32Array([1, 1, 1]),
      lightPos: new Float32Array([0, 0]), glow: 0, comp: new Float32Array([0, 0, 0, 1]), horizonY: 0,
    });
    const current = initialState();
    const target = initialState();
    window.__scene = { current, target };   // debug handle for verification

    // Probability tails (0.3%, 1%...) would render as thin rainbow fringes
    // wherever two main colours meet, since the field passes through every
    // slot in between. The shader only keeps colours with a real share.
    const MIN_SHARE = 0.03;

    function setTarget(data) {
      target.weights.fill(0);
      const kept = data.colors.filter((c) => c.weight >= MIN_SHARE);
      const total = kept.reduce((s, c) => s + c.weight, 0);
      for (const { name, weight } of kept) target.weights[ORDER.indexOf(name)] = weight / total;
      target.energy = data.motion.energy;
      target.texture = data.motion.texture;
      FORMS.forEach((f, i) => (target.form[i] = data.form[f]));
      target.conf = data.confidence;
      const sc = data.scene;
      target.bg.set(rgb(PALETTE[sc.background]));
      target.fg.set(rgb(PALETTE[sc.foreground]));
      target.light.set(rgb(PALETTE[sc.light]));
      target.lightPos.set(lightPosition(sc.lightPos, sc.horizon));
      target.glow = lightStrength(sc.lightPos, sc.glow);
      target.comp.set(compositionVector(sc.composition));
      target.horizonY = horizonY(sc.horizon);

      const topForm = FORMS.reduce((a, b) => (data.form[a] >= data.form[b] ? a : b));
      const topOf = (probs) => Object.entries(probs).reduce((a, b) => (b[1] > a[1] ? b : a));
      const [comp, compP] = topOf(sc.composition);
      const [lightAt] = topOf(sc.lightPos);
      hudEl.textContent =
        `energy   ${data.motion.energy.toFixed(2)}\n` +
        `texture  ${data.motion.texture.toFixed(2)}\n` +
        `form     ${topForm} ${(data.form[topForm] * 100).toFixed(0)}%\n` +
        `scene    ${comp} ${(compP * 100).toFixed(0)}%  ${sc.background} / ${sc.foreground}\n` +
        `light    ${sc.light} @ ${lightAt}  glow ${sc.glow.toFixed(2)}\n` +
        `conf     ${data.confidence.toFixed(2)}\n` +
        `jev      ${data.ms}ms`;
    }

    let shader = null;
    try { shader = createShader(); } catch (err) { console.error(err); }

    let last = performance.now();
    let clock = 0;
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (shader && document.body.classList.contains("shader")) {
        // Ease everything toward the latest answer; faster for energetic inputs.
        const k = 1 - Math.exp(-dt * (2 + current.energy * 3));
        const lerp = (a, b) => a + (b - a) * k;
        let sum = 0;
        for (let i = 0; i < N; i++) sum += current.weights[i] = lerp(current.weights[i], target.weights[i]);
        for (let i = 0; i < N; i++) current.weights[i] /= sum || 1;
        for (let i = 0; i < 4; i++) current.form[i] = lerp(current.form[i], target.form[i]);
        current.energy = lerp(current.energy, target.energy);
        current.texture = lerp(current.texture, target.texture);
        current.conf = lerp(current.conf, target.conf);
        for (const key of ["bg", "fg", "light", "lightPos", "comp"]) {
          for (let i = 0; i < current[key].length; i++) current[key][i] = lerp(current[key][i], target[key][i]);
        }
        current.glow = lerp(current.glow, target.glow);
        current.horizonY = lerp(current.horizonY, target.horizonY);

        // Accumulate time at the current speed so speed changes never jump.
        clock += dt * (0.03 + 0.5 * Math.pow(current.energy, 1.5));
        shader.draw(current, clock);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ------------------------------------------------------------------
    // Mode toggle
    // ------------------------------------------------------------------
    function setMode(mode) {
      if (!shader) mode = "stripes";
      document.body.classList.toggle("shader", mode === "shader");
      toggleEl.textContent = mode === "shader" ? "stripes" : "shader";
      try { localStorage.setItem("mode", mode); } catch {}
    }
    toggleEl.addEventListener("click", () => {
      setMode(document.body.classList.contains("shader") ? "stripes" : "shader");
      input.focus();
    });
    let saved = null;
    try { saved = localStorage.getItem("mode"); } catch {}
    setMode(saved ?? "shader");

    // ------------------------------------------------------------------
    // Querying
    // ------------------------------------------------------------------
    let controller;
    let timer;

    async function query(text) {
      controller?.abort();
      if (!text.trim()) return;
      controller = new AbortController();
      statusEl.classList.add("on");
      try {
        const res = await fetch(`/api/palette?q=${encodeURIComponent(text)}`, { signal: controller.signal });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? res.status);
        if (data.q === input.value) {
          renderStripes(data.colors);
          setTarget(data);
        }
      } catch (err) {
        if (err.name !== "AbortError") console.error(err);
      } finally {
        if (input.value === text) statusEl.classList.remove("on");
      }
    }

    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => query(input.value), 150);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { clearTimeout(timer); query(input.value); }
    });

    input.select();
    query(input.value);
  </script>
</body>
</html>
