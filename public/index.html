<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Color Canvas</title>
  <meta name="description" content="Type a word. It becomes the scene that word feels like." />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta property="og:title" content="Color Canvas" />
  <meta property="og:description" content="Type a word. It becomes the scene that word feels like." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jev-color-canvas.vercel.app/" />
  <meta property="og:image" content="https://jev-color-canvas.vercel.app/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Color Canvas, a soft field of red, pink, and teal." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Color Canvas" />
  <meta name="twitter:description" content="Type a word. It becomes the scene that word feels like." />
  <meta name="twitter:image" content="https://jev-color-canvas.vercel.app/preview.png" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html {
      height: 100%;
      background: #fff;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    /* Fallback behind Safari's glass and the overscroll rubber-band.
       The picture itself has to scroll under the bars; a fixed layer never does. */
    html:has(body.shader),
    body.shader { background: #000; }
    body {
      position: relative;
      height: 100%;
      background: #fff;
      color: #000;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    .band {
      position: absolute;
      inset: 0;
    }

    /* ---- shared input ---- */
    .top {
      position: absolute;
      inset: 0 0 50% 0;
      display: grid;
      place-items: center;
      padding:
        0
        max(16px, env(safe-area-inset-right))
        0
        max(16px, env(safe-area-inset-left));
      z-index: 2;
      pointer-events: none;
    }
    /* --accent follows the picture: its dominant colour, lifted to stay legible.
       Registered so it eases between words instead of snapping. */
    @property --accent { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
    html { transition: --accent 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }

    .field {
      position: relative;
      width: min(640px, 100%);
      pointer-events: auto;
      --bleed: 0.4px;
      transition: background 0.5s, box-shadow 0.6s;
    }
    input {
      width: 100%;
      border: 0;
      padding: 8px 0;
      font: inherit;
      font-size: clamp(18px, 3vw, 28px);
      text-align: center;
      background: transparent;
      color: inherit;
      outline: none;
      caret-color: currentColor;
    }
    body.shader input { caret-color: var(--accent); }
    body.shader input::selection {
      background: color-mix(in srgb, var(--accent) 38%, transparent);
      color: inherit;
    }

    /* Ideas to type, shown only while the field is empty. */
    .hint {
      position: absolute;
      inset: 0 0 3px 0;
      display: grid;
      place-items: center;
      font-size: clamp(18px, 3vw, 28px);
      white-space: nowrap;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
    input:placeholder-shown ~ .hint.on { opacity: 0.38; }

    /* The underline is the palette itself, in proportion. How soft its edges
       are is how unsure Jev is; while Jev thinks, light travels along it. */
    .line {
      position: absolute;
      left: var(--pad, 0px);
      right: var(--pad, 0px);
      bottom: var(--line-bottom, 0px);
      height: 3px;
      border-radius: 3px;
      display: flex;
      overflow: hidden;
      filter: blur(var(--bleed));
      pointer-events: none;
      transition: left 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), right 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
        height 0.3s, opacity 0.4s;
    }
    .field:not(:focus-within) .line {
      left: calc(var(--pad, 0px) + 27%);
      right: calc(var(--pad, 0px) + 27%);
      height: 2px;
      opacity: 0.75;
    }
    .seg {
      flex-basis: 0;
      min-width: 0;
      transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .line::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
      transform: translateX(-100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .field.thinking .line::after { opacity: 1; animation: sweep 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes sweep { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) {
      .field.thinking .line::after { animation: none; transform: none; opacity: 0.35; }
    }

    .status {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
      /* A message, not a control: clicks pass through to the picture instead
         of counting as "inside the field" (which would focus the input). */
      pointer-events: none;
      user-select: none;
    }
    .status.on { opacity: 0.6; }

    /* ---- stripes mode (the original replica) ---- */
    .stripes {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 50%;
      display: flex;
      overflow: hidden;
    }
    .stripe {
      flex-basis: 0;
      min-width: 0;
      transition: flex-grow 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* ---- shader mode ---- */
    /* On a phone the picture is a tall scrolling band, parked so it continues
       under Safari's glass. Fixed layers are clipped to the gap between the
       bars, which is why those bars were a flat colour. */
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .screen {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .screen .toggle,
    .screen .hud,
    .screen .field { pointer-events: auto; }
    html.bleed {
      height: auto;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: none;
    }
    html.bleed body {
      height: auto;
      overflow: visible;
    }
    html.bleed .band {
      position: relative;
      inset: auto;
      width: 100%;
      touch-action: none;
    }
    html.bleed .screen { inset: auto; left: 0; width: 100%; }
    html.bleed .field { touch-action: manipulation; }
    html.bleed .tray { touch-action: pan-x; }
    body.shader canvas { display: block; }
    body.shader .stripes { display: none; }
    body.shader .top { inset: 0 0 auto 0; height: 38%; color: #fff; }
    body.shader .field {
      --pad: 28px;
      --line-bottom: 10px;
      padding: 10px 28px 18px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 12px 44px -18px var(--accent);
    }
    body.shader .field:focus-within {
      background: rgba(0, 0, 0, 0.34);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 16px 60px -12px var(--accent);
    }
    body.shader .status { right: 28px; }
    /* A short phone, or one with the keyboard up, has no room to centre
       the field in the top band. Sit it under the mode button instead. */
    @media (max-height: 560px) {
      body.shader .top {
        height: auto;
        place-items: start center;
        padding-top: calc(max(12px, env(safe-area-inset-top)) + 60px);
      }
    }
    html.short body.shader .top {
      height: auto;
      place-items: start center;
      padding-top: calc(max(12px, env(safe-area-inset-top)) + 60px);
    }

    /* Swatch picker: opens at the tap when Jev was sure and you disagree. */
    .picker {
      position: fixed;
      z-index: 5;
      display: none;
      padding: 12px;
      border-radius: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 18px 50px -16px rgba(0, 0, 0, 0.6);
      font-size: 11px;
      transform-origin: 50% 100%;
    }
    .picker.on { display: block; animation: pop 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.25); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.92); } }
    .picker .cap { opacity: 0.65; margin: 0 2px 10px; letter-spacing: 0.02em; }
    .picker .row { display: grid; grid-template-columns: repeat(4, 30px); gap: 10px; }
    .sw {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.4), box-shadow 0.15s;
    }
    .sw:hover, .sw:focus-visible { transform: scale(1.18); outline: none; }
    .sw.cur { box-shadow: 0 0 0 2px #fff; }
    @media (pointer: coarse) {
      .picker .row { grid-template-columns: repeat(4, 40px); gap: 12px; }
      .sw { width: 40px; height: 40px; }
    }

    .hud {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      max-width: calc(100% - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
      z-index: 2;
      font-size: 11px;
      line-height: 1.6;
      padding: 8px 12px;
      border-radius: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      white-space: pre;
    }
    body.shader .hud { display: block; }

    .toggle {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 3;
      font: inherit;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      color: #000;
      cursor: pointer;
    }
    @media (pointer: coarse) {
      .toggle {
        min-height: 44px;
        padding: 10px 16px;
      }
      input { padding: 12px 0; }
    }
    body.shader .toggle {
      color: #fff;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Phone typing. The system keyboard stays (a page can't replace it).
       The same field drops down to sit on that keyboard, with phrases to try. */
    .tray {
      display: flex;
      gap: 18px;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 0;
      mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent);
    }
    .tray::-webkit-scrollbar { display: none; }
    .tray[hidden] { display: none; }
    .tray button {
      flex: none;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      font-size: 14px;
      line-height: 1.2;
      padding: 10px 0;
      min-height: 44px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .tray button:focus-visible { outline: 1px solid currentColor; outline-offset: 2px; }

    body.keyboard .top,
    html.short body.keyboard .top,
    body.shader.keyboard .top {
      inset: auto 0 0 0;
      height: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding:
        0
        max(16px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    body.keyboard .field {
      width: 100%;
      max-width: 640px;
      min-width: 0;
    }
    /* Stripes has no glass of its own. Give the dock a surface so the word
       stays readable once it sits on the colour bands. */
    body.keyboard:not(.shader) .field {
      background: #fff;
      border-radius: 18px;
      padding: 8px 20px 14px;
    }
    body.keyboard .hint { display: none; }
    body.keyboard input {
      font-size: 22px;
      text-align: center;
      padding: 6px 0 2px;
    }
    body.keyboard input::placeholder {
      font-size: 16px;
      color: color-mix(in srgb, currentColor 80%, transparent);
    }
    body.keyboard .status {
      top: auto;
      right: 0;
      bottom: calc(100% + 10px);
    }
    body.shader.keyboard .hud { display: none; }
  </style>
</head>
<body class="shader">
  <div class="band" id="band">
  <canvas id="gl"></canvas>
  <div class="stripes" id="stripes"></div>
  <div class="screen">
  <div class="top">
    <div class="field" id="field">
      <div class="tray" id="tray" role="group" aria-label="Try a phrase" hidden></div>
      <input id="q" value="tomato" placeholder=" " aria-label="Type a word" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" inputmode="text" />
      <div class="hint" id="hint" aria-hidden="true"></div>
      <div class="line" id="line" aria-hidden="true"></div>
      <div class="status" id="status" role="status"></div>
    </div>
  </div>
  <div class="hud" id="hud"></div>
  <button class="toggle" id="toggle"></button>
  </div>
  </div>
  <div class="picker" id="picker" role="group" aria-label="Choose a colour"></div>

  <script type="module">
    import { PALETTE, ORDER } from "/palette.mjs";
    import { horizonY, lightPosition, lightStrength, compositionVector } from "/scene-uniforms.mjs";
    import { decideSettle } from "/settle.mjs";
    import { pickerOptions } from "/swatches.mjs";
    import { createGovernor } from "/governor.mjs";

    // Safari's glass only blurs document pixels that scroll underneath it.
    // On a phone the picture is taller than the screen and held at a fixed
    // scroll, so the bars have picture behind them. Controls sit in the
    // visible slice of that band.
    const BLEED_PAD = 200;
    let bleedScroll = 0;

    function glassChrome() {
      return matchMedia("(hover: none) and (pointer: coarse)").matches;
    }

    function layoutBleed() {
      const band = document.getElementById("band");
      const screen = document.querySelector(".screen");
      const root = document.documentElement;
      const vv = window.visualViewport;
      if (vv) {
        root.style.setProperty("--vv-top", `${vv.offsetTop}px`);
        root.style.setProperty("--vv-left", `${vv.offsetLeft}px`);
        root.style.setProperty("--vv-width", `${vv.width}px`);
        root.style.setProperty("--vv-height", `${vv.height}px`);
        root.classList.toggle("short", vv.height <= 560);
      }
      if (!glassChrome()) {
        root.classList.remove("bleed");
        band.style.height = "";
        screen.style.top = "";
        screen.style.height = "";
        return;
      }
      root.classList.add("bleed");
      const full = window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      const height = vv ? vv.height : full;
      band.style.height = `${full + BLEED_PAD * 2}px`;
      screen.style.top = `${BLEED_PAD + top}px`;
      screen.style.height = `${height}px`;
      bleedScroll = BLEED_PAD;
    }

    function settleBleed() {
      if (!document.documentElement.classList.contains("bleed")) return;
      window.scrollTo(0, bleedScroll);
    }

    // A one-pixel jiggle makes Safari resample the bars. Repainting the
    // canvas alone leaves the glass on an old snapshot.
    function nudgeBars() {
      if (!document.documentElement.classList.contains("bleed")) return;
      window.scrollTo(0, bleedScroll + 1);
      requestAnimationFrame(() => window.scrollTo(0, bleedScroll));
    }

    function fitVisible() {
      layoutBleed();
      if (document.activeElement?.id !== "q") settleBleed();
    }
    window.addEventListener("resize", fitVisible);
    window.addEventListener("orientationchange", fitVisible);
    if (window.visualViewport) {
      visualViewport.addEventListener("resize", () => {
        layoutBleed();
        settleBleed();
        nudgeBars();
      });
      visualViewport.addEventListener("scroll", fitVisible);
    }
    window.addEventListener("scroll", () => {
      if (!document.documentElement.classList.contains("bleed")) return;
      if (document.activeElement?.id === "q") return;
      if (Math.abs(window.scrollY - bleedScroll) > 1) settleBleed();
    }, { passive: true });
    layoutBleed();
    settleBleed();

    const input = document.getElementById("q");
    const stripesEl = document.getElementById("stripes");
    const statusEl = document.getElementById("status");
    const fieldEl = document.getElementById("field");
    const lineEl = document.getElementById("line");
    const hintEl = document.getElementById("hint");
    const trayEl = document.getElementById("tray");
    const pickerEl = document.getElementById("picker");
    const hudEl = document.getElementById("hud");
    const toggleEl = document.getElementById("toggle");

    // ------------------------------------------------------------------
    // Stripes (original replica)
    // ------------------------------------------------------------------
    // One renderer per container: a band per colour whose flex-grow eases to
    // its share, so the stripes and the search-bar underline behave alike.
    function bandRenderer(container, className) {
      const els = new Map();
      return (colors) => {
        const seen = new Set();
        colors.forEach(({ name, hex, weight }, i) => {
          let el = els.get(name);
          if (!el) {
            el = document.createElement("div");
            el.className = className;
            el.style.flexGrow = "0";
            el.style.backgroundColor = hex;
            els.set(name, el);
            container.appendChild(el);
            el.getBoundingClientRect(); // commit the 0 width so it grows in
          }
          el.style.order = String(i);
          el.style.flexGrow = String(weight);
          el.title = `${name} ${(weight * 100).toFixed(0)}%`;
          seen.add(name);
        });
        for (const [name, el] of els) {
          if (!seen.has(name)) el.style.flexGrow = "0";
        }
      };
    }
    const renderStripes = bandRenderer(stripesEl, "stripe");
    const renderLine = bandRenderer(lineEl, "seg");

    // ------------------------------------------------------------------
    // Shader
    // ------------------------------------------------------------------
    // Every palette colour keeps a fixed slot. A new answer does not slide
    // one picture into the next. The shader paints the held picture and the
    // incoming one, then dissolves between those two finished images.
    const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    const N = ORDER.length;
    const FORMS = ["liquid", "organic", "geometric", "glitch"];

    const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;

uniform vec2 u_res;
uniform float u_time;
// Only the colours that actually paint, in palette order: linear rgb plus the
// share of the field each one owns. The shader loops over these, not all 64.
uniform vec4 u_bandH[${N}];
uniform vec4 u_bandN[${N}];
uniform int u_nH;
uniform int u_nN;
uniform float u_energyH;
uniform float u_energyN;
uniform float u_textureH;
uniform float u_textureN;
uniform vec4 u_formH;      // liquid, organic, geometric, glitch
uniform vec4 u_formN;
uniform float u_confH;
uniform float u_confN;
// Scene and light colours arrive in linear light (converted once on the CPU,
// not per pixel), unlike the sRGB values held in the JS state.
uniform vec3 u_bgH;
uniform vec3 u_bgN;
uniform vec3 u_fgH;
uniform vec3 u_fgN;
uniform vec3 u_bg2H;       // runner-up background / foreground colours
uniform vec3 u_bg2N;
uniform vec3 u_fg2H;
uniform vec3 u_fg2N;
uniform vec3 u_light2H;    // runner-up light colour
uniform vec3 u_light2N;
uniform vec3 u_ambH;       // runner-up share of the background, foreground, light
uniform vec3 u_ambN;
uniform vec3 u_lightH;
uniform vec3 u_lightN;
uniform vec2 u_lightPosH;
uniform vec2 u_lightPosN;
uniform float u_glowH;
uniform float u_glowN;
uniform vec4 u_compH;      // horizon, centre, vertical, field
uniform vec4 u_compN;
uniform float u_horizonH;
uniform float u_horizonN;
uniform vec4 u_settleH;    // per role (background, foreground): progress, goal (0 winner, 1 runner-up)
uniform vec4 u_settleN;
uniform float u_pick;      // 1 = write what each pixel shows, for tap picking
uniform float u_mix;       // 0 = held picture, 1 = incoming picture
uniform float u_heldTex;   // 1 when the held picture is a framebuffer still
uniform sampler2D u_held;

const float PI = 3.14159265;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.02 + 17.0; a *= 0.5; }
  return v;
}

// Mirror-fold x into 0..1 so bands never wrap with a seam. Scaling the cosine
// just under 1 rounds off the fold points, which would otherwise be hard creases.
float fold(float x) {
  const float k = 0.985;
  const float lo = 0.05522;   // acos(k) / PI
  return (acos(k * cos(PI * x)) / PI - lo) / (1.0 - 2.0 * lo);
}

// A per-cell random value that glides to its next value instead of snapping.
float glide(vec2 id, float t) {
  float i = floor(t), f = smoothstep(0.0, 1.0, fract(t));
  return mix(hash(id + i * 17.13), hash(id + (i + 1.0) * 17.13), f);
}

// Cell values interpolated with a narrow transition, so cells read as crisp
// tiles but the field stays continuous (no stair-stepping or aliasing).
float tiles(vec2 g, float t, float edge) {
  vec2 i = floor(g), f = fract(g);
  vec2 u = smoothstep(1.0 - edge, 1.0, f);
  return mix(mix(glide(i, t), glide(i + vec2(1, 0), t), u.x),
             mix(glide(i + vec2(0, 1), t), glide(i + vec2(1, 1), t), u.x), u.y);
}

vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }
vec3 toSrgb(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }

// Ambiguity as material: where Jev split its vote, the second colour appears
// as drifting patches sized by its share. Confidence sets how hard the patch
// edges are: an unsure answer bleeds, a sure one is crisp. A share of 0 (a
// settled answer) paints nothing, so unambiguous words look as before.
// 0 shows the winner, 1 shows the runner-up. A settled role slides its mask
// to 0 or 1 everywhere: the user's tap decided the vote.

      const chained = phase === "handoff";
      const shaderOn = shader && document.body.classList.contains("shader");
      // Stripes already swapped. A dissolve from a picture that isn't on screen
      // would play later, from the wrong held state.
      if (!shaderOn) {
        applyAnswer(next, data);
        copyState(current, next);
        copyState(target, next);
        mix = 1;
        heldIsTex = false;
        phase = "ready";
        return;
      }
      if (phase === "handoff" && shader.snapshot()) {
        heldIsTex = true;
      } else if (phase === "handoff") {
        // The composite couldn't be frozen. Continue from the picture that was arriving.
        copyState(held, next);
        heldIsTex = false;
      } else {
        copyState(held, phase === "ready" ? next : current);
        heldIsTex = false;
      }
      applyAnswer(next, data);
      mix = 0;
      handoffDur = handoffDuration(next.energy);
      if (chained) handoffDur = Math.min(handoffDur, CHAINED_HANDOFF_MAX);
      phase = "handoff";
    }

    // What Jev was unsure about, and which of it the user has since settled.
    let shownAmbiguity = null;
    let shownScene = null;
    const userSettled = new Set();

    function ambiguityLine(amb, settledRoles = userSettled) {
      const parts = Object.entries(amb ?? {})
        .filter(([role, a]) => a.share > 0 || settledRoles.has(role))
        .map(([role, a]) => (settledRoles.has(role) ? `${role} settled by you` : `${role} ↔ ${a.colour} ${(a.share * 100).toFixed(0)}%`));
      return parts.length ? parts.join(", ") : "Jev is sure";
    }

    function renderAmbiguityLine() {
      hudEl.textContent = hudEl.textContent.replace(/^unsure .*$/m, `unsure   ${ambiguityLine(shownAmbiguity)}`);
    }

    function setTarget(data) {
      shownAmbiguity = data.scene.ambiguity;
      shownScene = data.scene;
      userSettled.clear();
      closePicker(); // it was about the previous answer
      const topForm = FORMS.reduce((a, b) => (data.form[a] >= data.form[b] ? a : b));
      const topOf = (probs) => Object.entries(probs).reduce((a, b) => (b[1] > a[1] ? b : a));
      const sc = data.scene;
      const [comp, compP] = topOf(sc.composition);
      const [lightAt] = topOf(sc.lightPos);
      hudEl.textContent =
        `energy   ${data.motion.energy.toFixed(2)}\n` +
        `texture  ${data.motion.texture.toFixed(2)}\n` +
        `form     ${topForm} ${(data.form[topForm] * 100).toFixed(0)}%\n` +
        `scene    ${comp} ${(compP * 100).toFixed(0)}%  ${sc.background} / ${sc.foreground}\n` +
        `light    ${sc.light} @ ${lightAt}  glow ${sc.glow.toFixed(2)}\n` +
        `unsure   ${ambiguityLine(sc.ambiguity)}\n` +
        `conf     ${data.confidence.toFixed(2)}\n` +
        `jev      ${data.ms}ms\n` +
        `render   ${perfText}`;

      if (phase === "idle") {
        applyAnswer(target, data);
        phase = "arrive";
      } else {
        beginHandoff(data);
      }
      nudgeBars();
    }

    let shader = null;
    try { shader = createShader(); } catch (err) { console.error(err); }

    // ------------------------------------------------------------------
    // Settling a split vote by touch
    // ------------------------------------------------------------------
    // Tapping the canvas picks whichever colour is under the finger: a rival
    // patch takes over its whole region, or the winner absorbs the patches.
    // The pick happens in the frame loop so it reads the frame being shown.
    const SETTLE_SECONDS = 0.8;
    let pendingPick = null;

    function settleAt(state, x, y) {
      if (!shader || !document.body.classList.contains("shader")) return;
      const sample = shader.pick(state, clock, x, y);
      if (!sample) return;
      const decision = decideSettle(sample, {
        share: [state.amb[0], state.amb[1]],
        settled: [state.settleGoal[0] > 0, state.settleGoal[1] > 0],
      });
      if (decision.action === "sure") return openPicker(decision, x, y);
      if (decision.action === "done") return flash(`you already settled the ${decision.name}`);
      state.settle[decision.role * 2 + 1] = decision.to;
      state.settleGoal[decision.role] = 1;
      userSettled.add(decision.name);
      renderAmbiguityLine();
    }

    // ------------------------------------------------------------------
    // Swatch picker
    // ------------------------------------------------------------------
    // Jev was sure of this colour and you disagree. The picker offers Jev's
    // other ideas first, then the palette's nearest neighbours. Choosing one
    // reuses the settle machinery: the "runner-up" slot takes that colour and
    // the region eases over to it.
    let pickerRole = null;

    function closePicker() {
      pickerEl.classList.remove("on");
      pickerRole = null;
    }

    function openPicker(decision, x, y) {
      const winner = shownScene[decision.name];
      const names = pickerOptions({
        winner,
        jev: shownAmbiguity?.[decision.name]?.options ?? [],
        palette: PALETTE,
        count: 8,
      });
      const cap = document.createElement("div");
      cap.className = "cap";
      cap.textContent = `${decision.name} · Jev is sure. Pick another?`;
      const row = document.createElement("div");
      row.className = "row";
      for (const name of names) {
        const sw = document.createElement("button");
        sw.type = "button";
        sw.className = name === winner ? "sw cur" : "sw";
        sw.style.backgroundColor = PALETTE[name];
        sw.title = name;
        sw.setAttribute("aria-label", name === winner ? `${name} (current)` : name);
        sw.addEventListener("click", () => applyPicked(name));
        row.appendChild(sw);
      }
      pickerEl.replaceChildren(cap, row);
      pickerRole = decision;
      pickerEl.classList.add("on");

      // Above the finger when there is room, clamped inside the screen.
      const vv = window.visualViewport;
      const vw = vv?.width ?? innerWidth;
      const box = pickerEl.getBoundingClientRect();
      const left = Math.min(Math.max(x - box.width / 2, 8), vw - box.width - 8);
      const above = y - box.height - 16;
      const top = above >= 8 ? above : y + 16;
      pickerEl.style.left = `${left}px`;
      pickerEl.style.top = `${top}px`;
      pickerEl.style.transformOrigin = `${x - left}px ${above >= 8 ? "100%" : "0%"}`;
    }

    function applyPicked(name) {
      if (!pickerRole) return;
      const { role, name: roleName } = pickerRole;
      const state = phase === "idle" || phase === "arrive" ? current : next;
      const winner = shownScene[roleName];
      if (name === winner) {
        state.settle[role * 2 + 1] = 0;
      } else {
        // While the opening answer eases in, `current` chases `target` every
        // frame, so the colour has to land on both or it drifts back.
        const key = role === 0 ? "bg2" : "fg2";
        for (const s of state === current ? [current, target] : [state]) s[key].set(rgb(PALETTE[name]));
        state.settle[role * 2 + 1] = 1;
      }
      state.settleGoal[role] = 1;
      userSettled.add(roleName);
      renderAmbiguityLine();
      closePicker();
    }

    // A tap that changes nothing still answers, briefly, under the text field.
    let flashTimer;
    function flash(message) {
      clearTimeout(flashTimer);
      statusEl.textContent = message;
      statusEl.classList.add("on");
      flashTimer = setTimeout(() => statusEl.classList.remove("on"), 1800);
    }

    const canvasEl = document.getElementById("gl");
    // Debug aid, like window.__scene: what would a tap here decide?
    window.__pick = (x, y) => {
      const st = phase === "idle" || phase === "arrive" ? current : next;
      return shader?.pick(st, clock, x, y) ?? null;
    };
    canvasEl.addEventListener("pointerdown", (e) => {
      // On a phone, a tap is for the picture and the keyboard. Choosing a
      // foreground or background stays a pointer with a cursor.
      if (matchMedia("(hover: none) and (pointer: coarse)").matches) return;
      // While the text field has focus, this tap only puts the caret away
      // (the document-level handler does that). It must not also settle a
      // vote or pop the picker open. The next tap does.
      if (document.activeElement === input) return;
      pendingPick = { x: e.clientX, y: e.clientY };
    });

    // ------------------------------------------------------------------
    // Adaptive resolution
    // ------------------------------------------------------------------
    // Frame times feed a governor that picks the render scale. Dissolves are
    // not measured (they paint more and resizing mid-dissolve would pop), and
    // neither is a hidden tab.
    const governor = createGovernor();
    let perfText = "measuring…";
    let fpsEma = 0;
    let lastPerfPaint = 0;

    function renderPerfLine(now) {
      if (now - lastPerfPaint < 500) return;
      lastPerfPaint = now;
      const mp = shader ? shader.pixels() / 1e6 : 0;
      perfText = `${fpsEma.toFixed(0)}fps  ${governor.scale.toFixed(2)}x  ${mp.toFixed(1)}MP`;
      hudEl.textContent = hudEl.textContent.replace(/^render .*$/m, `render   ${perfText}`);
    }
    window.__perf = () => ({ fps: fpsEma, scale: governor.scale, megapixels: shader ? shader.pixels() / 1e6 : 0 });

    let last = performance.now();
    let clock = 0;
    function frame(now) {
      const rawMs = now - last;
      const dt = Math.min(rawMs / 1000, 0.1);
      last = now;
      if (shader && document.body.classList.contains("shader") && document.visibilityState === "visible") {
        if (rawMs > 0 && rawMs < 1000) fpsEma = fpsEma ? fpsEma + (1000 / rawMs - fpsEma) * 0.08 : 1000 / rawMs;
        if (phase !== "handoff") shader.setScale(governor.push(rawMs, now));
        renderPerfLine(now);
      }
      if (phase === "handoff") {
        mix = Math.min(1, mix + dt / handoffDur);
        if (mix >= 1) {
          phase = "ready";
          heldIsTex = false;
        }
      }

      if (shader && document.body.classList.contains("shader")) {
        let energy = current.energy;
        if (phase === "idle" || phase === "arrive") {
          // The opening answer eases in. Later answers do not use this path.
          const k = 1 - Math.exp(-dt * (2 + current.energy * 3));
          const lerp = (a, b) => a + (b - a) * k;
          let sum = 0;
          for (let i = 0; i < N; i++) sum += current.weights[i] = lerp(current.weights[i], target.weights[i]);
          for (let i = 0; i < N; i++) current.weights[i] /= sum || 1;
          for (let i = 0; i < 4; i++) current.form[i] = lerp(current.form[i], target.form[i]);
          current.energy = lerp(current.energy, target.energy);
          current.texture = lerp(current.texture, target.texture);
          current.conf = lerp(current.conf, target.conf);
          for (const key of ["bg", "fg", "bg2", "fg2", "amb", "light2", "light", "lightPos", "comp"]) {
            for (let i = 0; i < current[key].length; i++) current[key][i] = lerp(current[key][i], target[key][i]);
          }
          current.glow = lerp(current.glow, target.glow);
          current.horizonY = lerp(current.horizonY, target.horizonY);
          energy = current.energy;
        } else {
          energy = heldIsTex ? next.energy : held.energy + (next.energy - held.energy) * mix;
        }

        // Accumulate time at the current speed so speed changes never jump.
        clock += dt * (0.03 + 0.5 * Math.pow(energy, 1.5));

        // The scene the viewer is looking at, for settling votes by touch.
        const visible = phase === "idle" || phase === "arrive" ? current : next;
        for (let role = 0; role < 2; role++) {
          const i = role * 2;
          visible.settle[i] = Math.min(visible.settleGoal[role], visible.settle[i] + dt / SETTLE_SECONDS);
        }
        if (pendingPick) {
          settleAt(visible, pendingPick.x, pendingPick.y);
          pendingPick = null;
        }
        if (phase === "idle" || phase === "arrive") shader.draw(current, current, 1, false, clock);
        else shader.draw(held, next, mix, heldIsTex, clock);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ------------------------------------------------------------------
    // Mode toggle
    // ------------------------------------------------------------------
    function setMode(mode) {
      if (!shader) mode = "stripes";
      document.body.classList.toggle("shader", mode === "shader");
      toggleEl.textContent = mode === "shader" ? "stripes" : "shader";
      try { localStorage.setItem("mode", mode); } catch {}
    }
    toggleEl.addEventListener("click", () => {
      setMode(document.body.classList.contains("shader") ? "stripes" : "shader");
    });
    let saved = null;
    try { saved = localStorage.getItem("mode"); } catch {}
    setMode(saved ?? "shader");

    // ------------------------------------------------------------------
    // Querying
    // ------------------------------------------------------------------
    // Live typing: one request in flight, and the newest text waits behind it.
    // Aborting on every keystroke would starve the picture (each answer takes
    // ~200ms, so a typist never lets one land), and the server finishes the
    // Jev call anyway. Serial requests mean the picture trails the typing by
    // about one round trip, and the last answer is always for the final text.
    let timer;
    let inFlight = false;
    let pendingText = null;

    async function query(text) {
      if (!text.trim()) {
        if (!inFlight) fieldEl.classList.remove("thinking");
        return;
      }
      if (inFlight) {
        pendingText = text;
        return;
      }
      inFlight = true;
      fieldEl.classList.add("thinking");
      try {
        const res = await fetch(`/api/palette?q=${encodeURIComponent(text)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ?? res.status);
        // Apply even if the field has moved on: an intermediate picture is the point.
        renderStripes(data.colors);
        renderLine(data.colors);
        paintField(data);
        setTarget(data);
      } catch (err) {
        console.error(err);
      } finally {
        inFlight = false;
        const waiting = pendingText;
        pendingText = null;
        if (waiting && waiting !== text) query(waiting);
        else fieldEl.classList.remove("thinking");
      }
    }

    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => query(input.value), 150);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        clearTimeout(timer);
        query(input.value);
        // On a phone, Enter means done: put the keyboard away.
        if (matchMedia("(pointer: coarse)").matches) input.blur();
      }
    });

    // ------------------------------------------------------------------
    // The search bar
    // ------------------------------------------------------------------
    // The bar takes its cues from the picture: the caret and the glow use the
    // dominant colour, and the underline's edges soften as
    // Jev's confidence drops.
    const luminance = (hex) => {
      const [r, g, b] = rgb(hex);
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    };

    // The dominant colour, lifted when it is too dark (navy, charcoal) to
    // show on the glass, so a red word keeps a red caret.
    function accentOf(colors) {
      const lead = colors[0];
      const l = luminance(lead.hex);
      if (l >= 0.55) return lead.hex;
      const t = (0.55 - l) / (1 - l);
      const lifted = rgb(lead.hex).map((c) => Math.round((c + (1 - c) * t) * 255));
      return `rgb(${lifted.join(",")})`;
    }

    function paintField(data) {
      document.documentElement.style.setProperty("--accent", accentOf(data.colors));
      fieldEl.style.setProperty("--bleed", `${(1.1 - 0.9 * data.confidence).toFixed(2)}px`);
    }

    // Ideas for what to type, one at a time, only while the field is empty.
    const HINTS = [
      "a place, a feeling, a word",
      "burnt toast at 3am",
      "the last day of summer",
      "static on an old tv",
      "a room you miss",
      "thunder before rain",
    ];

    // Phrases sit on the keyboard while typing. Tapping one replaces the word
    // and puts the keyboard away so the picture can fill the screen.
    let phraseAt = 0;
    function usePhrase(phrase) {
      const now = performance.now();
      if (now - phraseAt < 400) return;
      phraseAt = now;
      input.value = phrase;
      clearTimeout(timer);
      query(phrase);
      input.blur();
    }
    for (const phrase of HINTS.slice(1)) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = phrase;
      btn.addEventListener("pointerdown", (e) => e.preventDefault());
      btn.addEventListener("pointerup", (e) => {
        e.preventDefault();
        usePhrase(phrase);
      });
      btn.addEventListener("click", () => usePhrase(phrase));
      trayEl.appendChild(btn);
    }

    // A page cannot replace the system keyboard. On a phone, focusing the
    // field means that keyboard is up, so the word docks to it.
    function syncKeyboard() {
      const open =
        document.activeElement === input &&
        matchMedia("(hover: none) and (pointer: coarse)").matches;
      document.body.classList.toggle("keyboard", open);
      trayEl.hidden = !open;
      input.placeholder = open ? HINTS[0] : " ";
    }
    input.addEventListener("focus", syncKeyboard);
    input.addEventListener("blur", () => {
      syncKeyboard();
      settleBleed();
      nudgeBars();
    });
    matchMedia("(hover: none) and (pointer: coarse)").addEventListener("change", syncKeyboard);
    let hintIndex = 0;
    const showHint = () => {
      hintEl.textContent = HINTS[hintIndex % HINTS.length];
      hintEl.classList.add("on");
    };
    setInterval(() => {
      if (input.value) return;
      hintEl.classList.remove("on");
      setTimeout(() => {
        hintIndex++;
        showHint();
      }, 750);
    }, 4200);
    showHint();

    // Focus follows intent. Clicking or tapping anywhere outside the bar
    // (and the picker) puts the caret away; typing anywhere brings it back
    // with the old word selected, ready to be replaced.
    document.addEventListener("pointerdown", (e) => {
      if (!pickerEl.contains(e.target)) closePicker();
      if (!e.target.closest(".field, .picker, .toggle")) input.blur();
    });
    fieldEl.addEventListener("pointerdown", (e) => {
      if (e.target === input || e.target.closest(".tray")) return;
      e.preventDefault();
      input.focus();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (pickerEl.classList.contains("on")) closePicker();
        else input.blur();
        return;
      }
      const idle = !document.activeElement || document.activeElement === document.body;
      if (!idle || e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
      input.focus();
      input.select();
    });

    // A phone keyboard would cover the picture if the field took focus on load.
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) input.select();
    query(input.value);
  </script>
</body>
</html>
